# ============================================================
# Experiment Metadata
# Production configuration for 6-feature champion model
# ============================================================

experiment:
  id: exp_production_v1
  description: Production deployment run for 6-feature Gradient Boosting model
  author: Nathan Groshek
  created: 2026-04-11
  random_seed: 42

# ============================================================
# Dataset Matrix
# ============================================================

# Path to the 6-feature master career database
onet_db_path: docs/data/master_careers_riasec_categories.csv

datasets:
  - name: production_onet_kaggle
    enabled: true
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
    split: null
    shuffle: false

# ============================================================
# Model Matrix
# Simplified to only include the champion Gradient Boosting model
# ============================================================

models:
  - model: gradient_boosting
    enabled: true
    parameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

# ============================================================
# Training Configuration
# ============================================================

training:
  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 1

# ============================================================
# Evaluation
# Updated to top_k: 20 to support "Reject & Replace" feature
# ============================================================

evaluation:
  metrics:
    - ndcg_at_k
    - precision_at_k
    - recall_at_k
  k_values:
    - 20
  benchmark_runs: 1
  progress_log_interval: 100
  top_k: 20
  max_test_samples: 5000

# ============================================================
# Output
# ============================================================

output:
  directory: experiments/results/exp_production_v1
  save_models: true
  save_predictions: true
  save_metrics: true
  save_metrics_csv: true

# ============================================================
# Export
# Enabled ONNX export for frontend compatibility
# ============================================================

export:
  export_inference_model: true
  format: onnx