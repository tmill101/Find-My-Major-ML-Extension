# ============================================================
# Experiment Metadata
# Functional template + smoke-test config
# ============================================================

experiment:
  id: exp_template_smoke
  description: Functional template configuration for pipeline smoke tests
  author: team_member
  created: YYYY-MM-DD
  random_seed: 42

# ============================================================
# Dataset Matrix
# Outer loop: each enabled dataset runs against each enabled model.
# ============================================================

onet_db_path: docs/data/master_careers_riasec_categories.csv

datasets:

  # Enabled by default for quick system verification
  - name: smoke_onet_kaggle
    enabled: true
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
    split: null
    shuffle: false

  # Optional example: auto-split a single training file
  - name: kaggle_split_optional
    enabled: false
    train_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
    test_path: null
    split:
      train: 0.70
      validation: 0.15
      test: 0.15
    shuffle: true

# ============================================================
# Model Matrix
# Inner loop: each enabled model runs on each enabled dataset.
# ============================================================

models:

  # Enabled default model for smoke testing
  - model: logistic_regression
    enabled: true
    parameters:
      C: 1.0
      max_iter: 300
      solver: lbfgs
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

  # Optional baseline model
  - model: heuristic
    enabled: false
    parameters:
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

# ============================================================
# Training Configuration
# ============================================================

training:
  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 1

# ============================================================
# Evaluation
# ============================================================

evaluation:
  metrics:
    - ndcg_at_k
    - precision_at_k
    - recall_at_k
  k_values:
    - 5
  benchmark_runs: 1
  progress_log_interval: 100
  top_k: 5
  max_test_samples: 25

# ============================================================
# Output
# ============================================================

output:
  directory: experiments/results/exp_template_smoke
  save_models: false
  save_predictions: false
  save_metrics: true
  save_metrics_csv: true

# ============================================================
# Export
# ============================================================

export:
  export_inference_model: false
  format: onnx
  save_model_artifact: false
  package_name: riasec_export_package.zip
  verify_package: true
  upload_script: null
  upload_arguments: []

# ============================================================
# Notes
# ============================================================

notes: |
  This file is intentionally lightweight so it can serve as both:
  1) a starter template for new experiments, and
  2) a fast end-to-end system smoke test.
